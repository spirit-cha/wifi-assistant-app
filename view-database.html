<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Viewer - Wi-Fi Complaints</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .stat-box h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .stat-box .value {
            font-size: 32px;
            color: #667eea;
            font-weight: bold;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-refresh {
            background: #667eea;
            color: white;
        }
        
        .btn-refresh:hover {
            background: #5568d3;
        }
        
        .btn-delete {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-delete:hover {
            background: #ee5a52;
        }
        
        .btn-export {
            background: #51cf66;
            color: white;
        }
        
        .btn-export:hover {
            background: #40c057;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .btn-view {
            background: #667eea;
            color: white;
        }
        
        .btn-delete-row {
            background: #ff6b6b;
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .detail-item {
            margin-bottom: 15px;
        }
        
        .detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
        }
        
        .detail-value {
            margin-top: 5px;
            color: #333;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Database Viewer</h1>
            <p>Wi-Fi Complaints Management System</p>
        </div>
        
        <div class="content">
            <div id="message"></div>
            
            <div class="stats">
                <div class="stat-box">
                    <h3>Total Complaints</h3>
                    <div class="value" id="totalCount">0</div>
                </div>
                <div class="stat-box">
                    <h3>Last Updated</h3>
                    <div class="value" id="lastUpdate" style="font-size: 16px;">-</div>
                </div>
            </div>
            
            <div class="buttons">
                <button class="btn-refresh" onclick="loadComplaints()">🔄 Refresh</button>
                <button class="btn-export" onclick="exportData()">📥 Export to JSON</button>
                <button class="btn-delete" onclick="deleteAllData()">🗑️ Delete All</button>
            </div>
            
            <div id="loading" class="loading" style="display: none;">
                ⏳ Loading complaints...
            </div>
            
            <div class="table-wrapper">
                <table id="complaintTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Primary Phone</th>
                            <th>Contract #</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                
                <div id="noData" class="no-data">
                    No complaints found. Submit one through the application!
                </div>
            </div>
        </div>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3000/api';
        
        async function loadComplaints() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('complaintTable');
            const noData = document.getElementById('noData');
            const tbody = document.getElementById('tableBody');
            
            loading.style.display = 'block';
            table.style.display = 'none';
            noData.style.display = 'none';
            
            try {
                const response = await fetch(`${API_URL}/complaints/all`);
                const data = await response.json();
                
                document.getElementById('totalCount').textContent = data.complaints.length;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                
                loading.style.display = 'none';
                
                if (data.complaints.length === 0) {
                    noData.style.display = 'block';
                } else {
                    tbody.innerHTML = '';
                    data.complaints.forEach(complaint => {
                        const row = `
                            <tr>
                                <td>${complaint.id}</td>
                                <td>${complaint.firstName} ${complaint.lastName}</td>
                                <td>${complaint.primaryPhone}</td>
                                <td>${complaint.contractNumber}</td>
                                <td>${new Date(complaint.createdAt).toLocaleString()}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-small btn-view" onclick="viewDetail(${complaint.id})">View</button>
                                        <button class="btn-small btn-delete-row" onclick="deleteComplaint(${complaint.id})">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                    table.style.display = 'table';
                }
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
                loading.style.display = 'none';
            }
        }
        
        async function viewDetail(id) {
            try {
                const response = await fetch(`${API_URL}/complaints/${id}`);
                const data = await response.json();
                const complaint = data.complaint;
                
                const html = `
                    <h2>Complaint Details (ID: ${complaint.id})</h2>
                    <div class="detail-item">
                        <div class="detail-label">Name</div>
                        <div class="detail-value">${complaint.firstName} ${complaint.lastName}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Primary Phone</div>
                        <div class="detail-value">${complaint.primaryPhone}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Secondary Phone</div>
                        <div class="detail-value">${complaint.secondaryPhone || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Contract Number</div>
                        <div class="detail-value">${complaint.contractNumber}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Landline Phone</div>
                        <div class="detail-value">${complaint.landlinePhone}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Address</div>
                        <div class="detail-value">${complaint.address || 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Location</div>
                        <div class="detail-value">(${complaint.latitude || 'N/A'}, ${complaint.longitude || 'N/A'})</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Video File</div>
                        <div class="detail-value">${complaint.videoFile || 'None'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Created At</div>
                        <div class="detail-value">${new Date(complaint.createdAt).toLocaleString()}</div>
                    </div>
                `;
                
                document.getElementById('modalBody').innerHTML = html;
                document.getElementById('modal').classList.add('show');
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }
        
        async function deleteComplaint(id) {
            if (!confirm('Are you sure you want to delete this complaint?')) return;
            
            try {
                await fetch(`${API_URL}/complaints/${id}`, { method: 'DELETE' });
                showMessage('✓ Complaint deleted successfully', 'success');
                setTimeout(loadComplaints, 1000);
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function deleteAllData() {
            if (!confirm('Delete ALL complaints? This cannot be undone!')) return;
            
            try {
                const complaints = await fetch(`${API_URL}/complaints/all`);
                const data = await complaints.json();
                
                for (const complaint of data.complaints) {
                    await fetch(`${API_URL}/complaints/${complaint.id}`, { method: 'DELETE' });
                }
                
                showMessage(`✓ Deleted ${data.complaints.length} complaints`, 'success');
                setTimeout(loadComplaints, 1000);
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function exportData() {
            try {
                const response = await fetch(`${API_URL}/complaints/all`);
                const data = await response.json();
                
                const json = JSON.stringify(data.complaints, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `complaints-${Date.now()}.json`;
                a.click();
                
                showMessage('✓ Data exported successfully', 'success');
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type === 'error' ? 'error' : 'success';
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        
        // Load complaints on page load
        window.onload = loadComplaints;
    </script>
</body>
</html>
